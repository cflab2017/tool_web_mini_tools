<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>로또 번호 추첨기 (6/45) — 코딩나우 도구</title>
<meta name="description" content="로또 6/45 번호를 자동으로 추첨합니다. 고정·제외 번호 지정, 추첨 애니메이션과 사운드, 결과 저장. 업로드 없이 브라우저에서." />
<meta property="og:title" content="로또 번호 추첨기 (6/45) — 코딩나우 도구" />
<meta property="og:description" content="로또 6/45 번호를 자동으로 추첨. 고정·제외 번호와 추첨 연출까지." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b0a08; --panel:#141210; --panel-2:#1c1916;
    --amber:#ffb000; --amber-dim:#b8801f; --amber-glow:rgba(255,176,0,.35);
    --green:#5ddc7a; --red:#e0876a; --line:#2a251e; --muted:#7a6f5c; --text:#f3e7cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono','Gowun Dodum',monospace;line-height:1.55}
  body{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom, rgba(255,176,0,.04) 0 1px, transparent 1px 3px);mix-blend-mode:multiply}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%)}
  .wrap{max-width:820px;width:100%;margin:0 auto;padding:24px 20px;flex:1}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
  .back{display:inline-block;color:var(--amber-dim);text-decoration:none;font-size:13px;letter-spacing:.04em}
  .back:hover{color:var(--amber)}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
  .lang button{background:var(--bg);color:var(--muted);border:none;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.05em;padding:6px 11px;cursor:pointer;transition:background .12s ease,color .12s ease}
  .lang button + button{border-left:1px solid var(--line)}
  .lang button.on{background:var(--amber);color:#0b0a08;font-weight:700}
  .lang button:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--amber-glow)}
  .badge{display:inline-block;border:1px solid var(--line);color:var(--amber-dim);padding:4px 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
  h1{font-family:'JetBrains Mono',monospace;font-size:clamp(26px,4.2vw,36px);color:var(--amber);text-shadow:0 0 12px var(--amber-glow);margin:12px 0 6px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  h1 .cursor{display:inline-block;width:.55ch;background:var(--amber);height:1em;animation:blink 1s steps(1) infinite;box-shadow:0 0 10px var(--amber-glow);vertical-align:-.12em}
  @keyframes blink{50%{opacity:0}}
  .sub{color:var(--muted);font-family:'Gowun Dodum',sans-serif;font-size:14.5px;margin:0 0 24px}
  .panel{background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:16px}
  .panel h2{font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber-dim);margin:0 0 14px;display:flex;align-items:center;gap:8px}
  .panel h2::before{content:"//";color:var(--line)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .field{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  input[type="number"],input[type="text"],select{
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    font-family:'JetBrains Mono','Gowun Dodum',monospace;font-size:15px;padding:10px 12px;border-radius:4px;
    width:100%;transition:border-color .12s ease, box-shadow .12s ease;
  }
  input:focus,select:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-glow)}
  .btn{background:var(--bg);border:1px solid var(--line);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:13px;padding:9px 14px;border-radius:4px;cursor:pointer;letter-spacing:.04em;transition:border-color .12s ease,color .12s ease,box-shadow .12s ease}
  .btn:hover:not(:disabled){border-color:var(--amber);color:var(--amber)}
  .btn:focus-visible{outline:none;border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-glow)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.primary{border-color:var(--amber);color:var(--amber);text-shadow:0 0 8px var(--amber-glow)}
  .btn.sound.on{border-color:var(--amber);color:var(--amber)}
  .actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .draw-btn{font-size:15px;padding:12px 22px;font-weight:700}

  .sets{display:flex;flex-direction:column;gap:12px;margin-top:6px}
  .set-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .set-no{font-family:'JetBrains Mono',monospace;color:var(--muted);font-size:12px;min-width:28px;flex:none}
  .balls{display:flex;gap:8px;flex-wrap:wrap}
  .ball{
    width:42px;height:42px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;color:#1a1205;
    box-shadow:inset 0 -3px 6px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.4);
    transform:scale(0);opacity:0;transition:transform .18s cubic-bezier(.34,1.56,.64,1), opacity .18s ease;
  }
  .ball.show{transform:scale(1);opacity:1}
  .ball.r1{background:#fbc400} .ball.r2{background:#69c8f2} .ball.r3{background:#ff7272}
  .ball.r4{background:#aaaaaa} .ball.r5{background:#b0d840}
  @media (max-width:480px){ .ball{width:36px;height:36px;font-size:14px} }
  .empty{color:var(--muted);font-family:'Gowun Dodum',sans-serif;font-size:13px}

  .saved-list{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .saved-item{display:flex;align-items:flex-start;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
  .saved-item .s-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
  .saved-item .s-ts{color:var(--muted);font-size:11px;letter-spacing:.04em}
  .saved-item .s-sets{display:flex;flex-direction:column;gap:6px}
  .saved-item .balls .ball{width:30px;height:30px;font-size:13px;transform:none;opacity:1;transition:none}
  .saved-item .s-del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:4px;cursor:pointer;font-size:14px;width:30px;height:30px;flex:none;transition:border-color .12s ease,color .12s ease}
  .saved-item .s-del:hover{border-color:var(--red);color:var(--red)}
  .saved-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
  .note{font-family:'Gowun Dodum',sans-serif;color:var(--muted);font-size:13px;margin-top:14px;line-height:1.7}
  .note.warn{color:var(--red)}
  footer{border-top:1px solid var(--line);margin-top:24px;padding:14px 20px;color:var(--muted);font-size:12px;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  footer a{color:var(--amber-dim);text-decoration:none}
  footer a[aria-disabled="true"]{pointer-events:none;opacity:.4}
  .prompt::before{content:"$ ";color:var(--amber-dim)}
</style>
</head>
<body>
  <div class="wrap">
    <div class="bar">
      <a class="back" data-i18n="back" href="../index.html">← 도구 목록</a>
      <div class="lang" role="group" aria-label="Language / 언어">
        <button type="button" data-lang="ko">KR</button>
        <button type="button" data-lang="en">EN</button>
      </div>
    </div>
    <span class="badge" data-i18n="badge">CODINGNOW · LOTTO</span>
    <h1><span class="prompt"></span><span data-i18n="h1">로또 추첨기</span><span class="cursor" aria-hidden="true"></span></h1>
    <p class="sub" data-i18n="sub">로또 6/45 번호를 자동으로 추첨합니다. 고정·제외 번호와 추첨 연출, 결과 저장까지. 모든 처리는 브라우저에서만 이뤄집니다.</p>

    <!-- 옵션 -->
    <section class="panel" aria-label="options">
      <h2 data-i18n="secOptions">추첨 옵션</h2>
      <div class="row">
        <div class="field" style="flex:.7">
          <label for="gameCount" data-i18n="lblGames">게임 수 (1~5)</label>
          <input id="gameCount" type="number" min="1" max="5" value="5" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="fixedNums" data-i18n="lblFixed">고정 번호 (최대 5개)</label>
          <input id="fixedNums" type="text" data-i18n-ph="phFixed" placeholder="예: 7, 14, 21" />
        </div>
        <div class="field">
          <label for="exclNums" data-i18n="lblExcl">제외 번호</label>
          <input id="exclNums" type="text" data-i18n-ph="phExcl" placeholder="예: 4, 13" />
        </div>
      </div>
      <div class="actions">
        <button class="btn primary draw-btn" id="drawBtn" type="button" data-i18n="btnDraw">🎱 추첨하기</button>
        <button class="btn" id="saveBtn" type="button" data-i18n="btnSave" disabled>＋ 이 결과 저장</button>
        <button class="btn sound on" id="soundBtn" type="button" aria-pressed="true" data-i18n="soundOn">🔊 사운드 ON</button>
      </div>
      <p class="note warn" id="optMsg" style="display:none"></p>
    </section>

    <!-- 결과 -->
    <section class="panel" aria-label="result">
      <h2 data-i18n="secResult">추첨 결과</h2>
      <div class="sets" id="sets"></div>
      <p class="empty" id="resultEmpty" data-i18n="resultEmpty">추첨하기를 누르면 번호가 여기에 표시됩니다.</p>
    </section>

    <!-- 저장 -->
    <section class="panel" aria-label="saved">
      <div class="saved-head">
        <h2 style="margin:0" data-i18n="secSaved">저장된 번호</h2>
        <button class="btn" id="clearAll" type="button" data-i18n="btnClearAll" style="display:none">전체 비우기</button>
      </div>
      <div class="saved-list" id="savedList"></div>
      <p class="empty" id="savedEmpty" data-i18n="savedEmpty">＋ 버튼으로 저장하면 여기에 모여 표시됩니다.</p>
    </section>

    <p class="note" data-i18n-html="disclaimer">※ 본 추첨기는 재미·참고용이며, 당첨을 보장하지 않습니다. 모든 번호는 무작위로 생성됩니다.</p>
  </div>

  <footer>
    <span data-i18n="footer">CODINGNOW · 로또 추첨기</span>
    <span><a id="donate" href="#" aria-disabled="true" data-i18n="donate">☕ 후원하기</a></span>
  </footer>

<script>
  const DONATE_URL = "https://paypal.me/codingnow";
  (function(){ const el=document.getElementById('donate'); if(DONATE_URL){ el.href=DONATE_URL; el.removeAttribute('aria-disabled'); el.target="_blank"; el.rel="noopener"; } })();

  const I18N = {
    ko: {
      back:"← 도구 목록",
      badge:"CODINGNOW · LOTTO",
      h1:"로또 추첨기",
      sub:"로또 6/45 번호를 자동으로 추첨합니다. 고정·제외 번호와 추첨 연출, 결과 저장까지. 모든 처리는 브라우저에서만 이뤄집니다.",
      title:"로또 번호 추첨기 (6/45) — 코딩나우 도구",
      footer:"CODINGNOW · 로또 추첨기",
      donate:"☕ 후원하기",
      secOptions:"추첨 옵션",
      lblGames:"게임 수 (1~5)", lblFixed:"고정 번호 (최대 5개)", lblExcl:"제외 번호",
      phFixed:"예: 7, 14, 21", phExcl:"예: 4, 13",
      btnDraw:"🎱 추첨하기", btnDrawing:"추첨 중…", btnSave:"＋ 이 결과 저장",
      soundOn:"🔊 사운드 ON", soundOff:"🔇 사운드 OFF",
      secResult:"추첨 결과", resultEmpty:"추첨하기를 누르면 번호가 여기에 표시됩니다.",
      secSaved:"저장된 번호", btnClearAll:"전체 비우기",
      savedEmpty:"＋ 버튼으로 저장하면 여기에 모여 표시됩니다.",
      disclaimer:"※ 본 추첨기는 재미·참고용이며, 당첨을 보장하지 않습니다. 모든 번호는 무작위로 생성됩니다.",
      // 동적
      gameLabel:(n)=>`${n}게임`,
      errFixedRange:"고정 번호는 1~45 사이여야 합니다.",
      errExclRange:"제외 번호는 1~45 사이여야 합니다.",
      errFixedCount:"고정 번호는 최대 5개까지 지정할 수 있습니다.",
      errOverlap:"고정 번호와 제외 번호가 겹칩니다.",
      errPool:"제외 번호가 너무 많아 6개를 뽑을 수 없습니다.",
    },
    en: {
      back:"← Tools",
      badge:"CODINGNOW · LOTTO",
      h1:"Lotto Generator",
      sub:"Draw Korean Lotto 6/45 numbers automatically — with fixed/excluded picks, an animated draw, and saved results. Everything runs in your browser.",
      title:"Lotto Number Generator (6/45) — CODINGNOW Tools",
      footer:"CODINGNOW · Lotto Generator",
      donate:"☕ Donate",
      secOptions:"Draw options",
      lblGames:"Games (1–5)", lblFixed:"Fixed numbers (max 5)", lblExcl:"Excluded numbers",
      phFixed:"e.g. 7, 14, 21", phExcl:"e.g. 4, 13",
      btnDraw:"🎱 Draw", btnDrawing:"Drawing…", btnSave:"＋ Save result",
      soundOn:"🔊 Sound ON", soundOff:"🔇 Sound OFF",
      secResult:"Result", resultEmpty:"Press Draw and the numbers will appear here.",
      secSaved:"Saved numbers", btnClearAll:"Clear all",
      savedEmpty:"Save with the ＋ button and results will appear here.",
      disclaimer:"※ For fun and reference only — winning is not guaranteed. All numbers are generated at random.",
      // dynamic
      gameLabel:(n)=>`Game ${n}`,
      errFixedRange:"Fixed numbers must be between 1 and 45.",
      errExclRange:"Excluded numbers must be between 1 and 45.",
      errFixedCount:"You can fix at most 5 numbers.",
      errOverlap:"Fixed and excluded numbers overlap.",
      errPool:"Too many excluded numbers — cannot draw 6.",
    },
  };

  function detectLang(){
    try { const s = localStorage.getItem('lang'); if (s === 'ko' || s === 'en') return s; } catch (e) {}
    return (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en';
  }
  let lang = detectLang();
  const L = () => I18N[lang];

  const $ = id => document.getElementById(id);
  const state = { sound: true, lastSets: null, drawing: false };

  // ---- 색상 매핑 (한국 로또 공식) ----
  function ballClass(n){
    if (n <= 10) return 'r1';
    if (n <= 20) return 'r2';
    if (n <= 30) return 'r3';
    if (n <= 40) return 'r4';
    return 'r5';
  }

  // ---- 사운드 (ladder-game 패턴) ----
  let actx = null;
  function ensureAudio(){
    if (!state.sound) return;
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  }
  function beep(freq, dur=0.07, type='square', vol=0.06){
    if (!state.sound || !actx) return;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    const t = actx.currentTime;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur);
  }

  // ---- 추첨 로직 ----
  function parseNums(str){
    return (str || '').split(/[^0-9]+/).filter(s => s.length).map(Number);
  }
  // 반환: { sets } 또는 { error }
  function buildDraw(){
    const games = Math.max(1, Math.min(5, parseInt($('gameCount').value, 10) || 1));
    const fixed = parseNums($('fixedNums').value);
    const excl = parseNums($('exclNums').value);

    for (const n of fixed){ if (n < 1 || n > 45) return { error: L().errFixedRange }; }
    for (const n of excl){ if (n < 1 || n > 45) return { error: L().errExclRange }; }
    const fixedSet = [...new Set(fixed)];
    const exclSet = new Set(excl);
    if (fixedSet.length > 5) return { error: L().errFixedCount };
    if (fixedSet.some(n => exclSet.has(n))) return { error: L().errOverlap };

    const pool = [];
    for (let n = 1; n <= 45; n++){ if (!exclSet.has(n) && !fixedSet.includes(n)) pool.push(n); }
    if (fixedSet.length + pool.length < 6) return { error: L().errPool };

    const sets = [];
    for (let g = 0; g < games; g++){
      const p = pool.slice();
      // Fisher–Yates
      for (let i = p.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [p[i], p[j]] = [p[j], p[i]];
      }
      const pick = fixedSet.concat(p.slice(0, 6 - fixedSet.length));
      pick.sort((a, b) => a - b);
      sets.push(pick);
    }
    return { sets };
  }

  function makeBall(n, animated){
    const b = document.createElement('span');
    b.className = 'ball ' + ballClass(n) + (animated ? '' : ' show');
    b.textContent = n;
    return b;
  }

  function renderSetsAnimated(sets){
    const cont = $('sets');
    cont.innerHTML = '';
    $('resultEmpty').style.display = 'none';
    const rows = sets.map((set, gi) => {
      const row = document.createElement('div');
      row.className = 'set-row';
      const no = document.createElement('span');
      no.className = 'set-no'; no.textContent = L().gameLabel(gi + 1);
      const balls = document.createElement('div'); balls.className = 'balls';
      row.appendChild(no); row.appendChild(balls);
      cont.appendChild(row);
      return { balls, set };
    });
    // 순차 등장
    let delay = 0;
    rows.forEach(({ balls, set }, gi) => {
      set.forEach((n) => {
        const b = makeBall(n, true);
        balls.appendChild(b);
        setTimeout(() => { b.classList.add('show'); beep(440 + (n % 12) * 22); }, delay);
        delay += 110;
      });
      // 게임 완성 음
      setTimeout(() => beep(660, 0.12, 'triangle', 0.07), delay);
      delay += 80;
    });
    return delay;
  }

  function draw(){
    if (state.drawing) return;
    ensureAudio();
    const res = buildDraw();
    if (res.error){
      $('optMsg').textContent = res.error; $('optMsg').style.display = 'block';
      return;
    }
    $('optMsg').style.display = 'none';
    state.lastSets = res.sets;
    state.drawing = true;
    $('drawBtn').disabled = true;
    $('saveBtn').disabled = true;
    $('drawBtn').textContent = L().btnDrawing;
    const total = renderSetsAnimated(res.sets);
    setTimeout(() => {
      state.drawing = false;
      $('drawBtn').disabled = false;
      $('drawBtn').textContent = L().btnDraw;
      $('saveBtn').disabled = false;
    }, total + 60);
  }

  // 정적 렌더(애니메이션 없이, 언어 전환 시 재렌더용)
  function renderSetsStatic(sets){
    const cont = $('sets');
    cont.innerHTML = '';
    if (!sets || !sets.length){ $('resultEmpty').style.display = 'block'; return; }
    $('resultEmpty').style.display = 'none';
    sets.forEach((set, gi) => {
      const row = document.createElement('div');
      row.className = 'set-row';
      const no = document.createElement('span');
      no.className = 'set-no'; no.textContent = L().gameLabel(gi + 1);
      const balls = document.createElement('div'); balls.className = 'balls';
      set.forEach(n => balls.appendChild(makeBall(n, false)));
      row.appendChild(no); row.appendChild(balls);
      cont.appendChild(row);
    });
  }

  // ---- 저장 ----
  const SKEY = 'lottoSaved';
  function loadSaved(){ try { return JSON.parse(localStorage.getItem(SKEY)) || []; } catch(e){ return []; } }
  function storeSaved(arr){ try { localStorage.setItem(SKEY, JSON.stringify(arr)); } catch(e){} }
  function fmtTs(ts){
    const d = new Date(ts);
    return new Intl.DateTimeFormat(lang==='ko'?'ko-KR':'en-US', {dateStyle:'medium', timeStyle:'short'}).format(d);
  }
  function renderSaved(){
    const arr = loadSaved();
    const cont = $('savedList');
    cont.innerHTML = '';
    $('clearAll').style.display = arr.length ? '' : 'none';
    if (!arr.length){ $('savedEmpty').style.display = 'block'; return; }
    $('savedEmpty').style.display = 'none';
    arr.slice().reverse().forEach(entry => {
      const item = document.createElement('div');
      item.className = 'saved-item';
      const body = document.createElement('div'); body.className = 's-body';
      const ts = document.createElement('div'); ts.className = 's-ts'; ts.textContent = fmtTs(entry.ts);
      const setsWrap = document.createElement('div'); setsWrap.className = 's-sets';
      entry.sets.forEach(set => {
        const balls = document.createElement('div'); balls.className = 'balls';
        set.forEach(n => balls.appendChild(makeBall(n, false)));
        setsWrap.appendChild(balls);
      });
      body.appendChild(ts); body.appendChild(setsWrap);
      const del = document.createElement('button');
      del.className = 's-del'; del.type = 'button'; del.textContent = '✕'; del.setAttribute('aria-label', 'delete');
      del.addEventListener('click', () => { storeSaved(loadSaved().filter(x => x.id !== entry.id)); renderSaved(); });
      item.appendChild(body); item.appendChild(del);
      cont.appendChild(item);
    });
  }
  $('saveBtn').addEventListener('click', () => {
    if (!state.lastSets) return;
    const arr = loadSaved();
    arr.push({ id: Date.now()+'-'+Math.random().toString(36).slice(2,7), sets: state.lastSets, ts: Date.now() });
    storeSaved(arr);
    renderSaved();
  });
  $('clearAll').addEventListener('click', () => { storeSaved([]); renderSaved(); });

  // ---- 사운드 토글 ----
  $('soundBtn').addEventListener('click', () => {
    state.sound = !state.sound;
    const b = $('soundBtn');
    b.classList.toggle('on', state.sound);
    b.setAttribute('aria-pressed', state.sound ? 'true' : 'false');
    b.textContent = state.sound ? L().soundOn : L().soundOff;
    if (state.sound) ensureAudio();
  });

  $('drawBtn').addEventListener('click', draw);

  // ---- i18n ----
  function applyLang(){
    document.documentElement.lang = lang;
    document.title = L().title;
    document.querySelectorAll('[data-i18n]').forEach(node => {
      const v = L()[node.getAttribute('data-i18n')];
      if (typeof v === 'string') node.textContent = v;
    });
    document.querySelectorAll('[data-i18n-html]').forEach(node => {
      const v = L()[node.getAttribute('data-i18n-html')];
      if (typeof v === 'string') node.innerHTML = v;
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(node => {
      const v = L()[node.getAttribute('data-i18n-ph')];
      if (typeof v === 'string') node.setAttribute('placeholder', v);
    });
    document.querySelectorAll('.lang button[data-lang]').forEach(b => b.classList.toggle('on', b.getAttribute('data-lang') === lang));
    // 상태 의존 라벨
    $('soundBtn').textContent = state.sound ? L().soundOn : L().soundOff;
    $('drawBtn').textContent = state.drawing ? L().btnDrawing : L().btnDraw;
    // 동적 영역 재렌더
    renderSetsStatic(state.lastSets);
    renderSaved();
  }
  document.querySelectorAll('.lang button[data-lang]').forEach(b => {
    b.addEventListener('click', () => {
      const next = b.getAttribute('data-lang');
      if (next === lang) return;
      lang = next;
      try { localStorage.setItem('lang', lang); } catch (e) {}
      applyLang();
    });
  });

  applyLang();
</script>
</body>
</html>
