<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>만 나이 계산기 — 코딩나우 도구</title>
<meta name="description" content="생년월일로 만 나이와 다음 생일까지 D-day, 살아온 총 일수를 계산합니다. 한국식 연 나이도 함께 표시." />
<meta property="og:title" content="만 나이 계산기 — 코딩나우 도구" />
<meta property="og:description" content="생년월일로 만 나이와 다음 생일까지 D-day를 계산합니다." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b0a08; --panel:#141210; --panel-2:#1c1916;
    --amber:#ffb000; --amber-dim:#b8801f; --amber-glow:rgba(255,176,0,.35);
    --green:#5ddc7a; --red:#e0876a; --line:#2a251e; --muted:#7a6f5c; --text:#f3e7cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono','Gowun Dodum',monospace;line-height:1.55}
  body{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom, rgba(255,176,0,.04) 0 1px, transparent 1px 3px);mix-blend-mode:multiply}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%)}
  .wrap{max-width:820px;width:100%;margin:0 auto;padding:24px 20px;flex:1}
  .back{display:inline-block;color:var(--amber-dim);text-decoration:none;font-size:13px;margin-bottom:14px;letter-spacing:.04em}
  .back:hover{color:var(--amber)}
  .badge{display:inline-block;border:1px solid var(--line);color:var(--amber-dim);padding:4px 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
  h1{font-family:'JetBrains Mono',monospace;font-size:clamp(26px,4.2vw,36px);color:var(--amber);text-shadow:0 0 12px var(--amber-glow);margin:12px 0 6px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  h1 .cursor{display:inline-block;width:.55ch;background:var(--amber);height:1em;animation:blink 1s steps(1) infinite;box-shadow:0 0 10px var(--amber-glow);vertical-align:-.12em}
  @keyframes blink{50%{opacity:0}}
  .sub{color:var(--muted);font-family:'Gowun Dodum',sans-serif;font-size:14.5px;margin:0 0 24px}
  .panel{background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--line);border-radius:6px;padding:20px;margin-bottom:16px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .field{flex:1;min-width:90px;display:flex;flex-direction:column;gap:6px}
  .field label{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  input[type="number"],input[type="date"]{
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    font-family:'JetBrains Mono',monospace;font-size:16px;padding:10px 12px;border-radius:4px;
    width:100%;transition:border-color .12s ease, box-shadow .12s ease;
  }
  input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-glow)}
  .ref{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
  .ref label{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .out{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px}
  @media (max-width:520px){.out{grid-template-columns:1fr}}
  .big{
    grid-column:1/-1;text-align:center;padding:26px 16px;
    background:var(--bg);border:1px solid var(--line);border-radius:6px;
  }
  .big .label{font-size:12px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase}
  .big .value{
    font-family:'JetBrains Mono',monospace;font-weight:700;
    color:var(--amber);text-shadow:0 0 14px var(--amber-glow);
    font-size:clamp(44px,9vw,72px);line-height:1.1;margin-top:6px;
  }
  .big .unit{color:var(--amber-dim);font-size:18px;margin-left:6px}
  .stat{
    background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:14px 16px;
  }
  .stat .label{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .stat .value{font-family:'JetBrains Mono',monospace;color:var(--text);font-size:22px;margin-top:4px}
  .stat .value.amber{color:var(--amber);text-shadow:0 0 8px var(--amber-glow)}
  .note{font-family:'Gowun Dodum',sans-serif;color:var(--muted);font-size:13px;margin-top:14px;line-height:1.7}
  .warn{color:var(--red)}
  footer{border-top:1px solid var(--line);margin-top:24px;padding:14px 20px;color:var(--muted);font-size:12px;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  footer a{color:var(--amber-dim);text-decoration:none}
  footer a[aria-disabled="true"]{pointer-events:none;opacity:.4}
  .prompt::before{content:"$ ";color:var(--amber-dim)}
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="../index.html">← 도구 목록</a>
    <span class="badge">CODINGNOW · 만 나이</span>
    <h1><span class="prompt"></span>만 나이 계산기<span class="cursor" aria-hidden="true"></span></h1>
    <p class="sub">생년월일과 기준일을 입력하면 만 나이, 다음 생일까지 D-day, 살아온 총 일수를 알려줍니다.</p>

    <section class="panel" aria-label="입력">
      <div class="row">
        <div class="field">
          <label for="y">출생 연도</label>
          <input id="y" type="number" min="1900" max="2100" placeholder="예: 1990" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="m">월</label>
          <input id="m" type="number" min="1" max="12" placeholder="1~12" inputmode="numeric" />
        </div>
        <div class="field">
          <label for="d">일</label>
          <input id="d" type="number" min="1" max="31" placeholder="1~31" inputmode="numeric" />
        </div>
      </div>
      <div class="ref">
        <label for="ref">기준일</label>
        <input id="ref" type="date" style="max-width:200px" />
      </div>
    </section>

    <section class="panel" aria-label="결과">
      <div class="out">
        <div class="big">
          <div class="label">만 나이</div>
          <div class="value"><span id="ageVal">–</span><span class="unit">세</span></div>
        </div>
        <div class="stat">
          <div class="label">다음 생일까지</div>
          <div class="value amber" id="dday">–</div>
        </div>
        <div class="stat">
          <div class="label">살아온 총 일수</div>
          <div class="value" id="days">–</div>
        </div>
        <div class="stat">
          <div class="label">한국식 연 나이 (참고)</div>
          <div class="value" id="kage">–</div>
        </div>
        <div class="stat">
          <div class="label">다음 생일</div>
          <div class="value" id="nextBday">–</div>
        </div>
      </div>
      <p class="note" id="msg">생년월일을 입력해주세요.</p>
      <p class="note">
        2023년 6월 28일 「만 나이 통일법」 시행 이후 행정·민사상 기준은 <strong style="color:var(--amber-dim)">만 나이</strong>입니다.
        <br />2월 29일생은 평년에는 3월 1일에 한 살을 더 먹는 것으로 계산합니다.
      </p>
    </section>
  </div>

  <footer>
    <span>CODINGNOW · 만 나이 계산기</span>
    <span><a id="donate" href="#" aria-disabled="true">☕ 후원하기</a></span>
  </footer>

<script>
  const DONATE_URL = "";
  (function(){ const el = document.getElementById('donate'); if (DONATE_URL){ el.href=DONATE_URL; el.removeAttribute('aria-disabled'); el.target="_blank"; el.rel="noopener"; } })();

  const $y = document.getElementById('y');
  const $m = document.getElementById('m');
  const $d = document.getElementById('d');
  const $ref = document.getElementById('ref');
  const $ageVal = document.getElementById('ageVal');
  const $dday = document.getElementById('dday');
  const $days = document.getElementById('days');
  const $kage = document.getElementById('kage');
  const $nextBday = document.getElementById('nextBday');
  const $msg = document.getElementById('msg');

  const today = new Date();
  const pad = n => String(n).padStart(2,'0');
  $ref.value = `${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;

  const nf = new Intl.NumberFormat('ko-KR');

  function isValidDate(y,m,d){
    if (!Number.isInteger(y)||!Number.isInteger(m)||!Number.isInteger(d)) return false;
    if (m<1||m>12||d<1||d>31) return false;
    const dt = new Date(Date.UTC(y,m-1,d));
    return dt.getUTCFullYear()===y && dt.getUTCMonth()===m-1 && dt.getUTCDate()===d;
  }

  function isLeap(y){ return (y%4===0 && y%100!==0) || y%400===0; }

  function nextBirthday(birthY, birthM, birthD, ref){
    const ry = ref.getUTCFullYear();
    const candidateYear = ry;
    function makeBday(yr){
      if (birthM===2 && birthD===29 && !isLeap(yr)){
        return new Date(Date.UTC(yr, 2, 1));
      }
      return new Date(Date.UTC(yr, birthM-1, birthD));
    }
    let bd = makeBday(candidateYear);
    if (bd.getTime() < Date.UTC(ry, ref.getUTCMonth(), ref.getUTCDate())) {
      bd = makeBday(candidateYear+1);
    }
    return bd;
  }

  function compute(){
    const y = parseInt($y.value,10);
    const m = parseInt($m.value,10);
    const d = parseInt($d.value,10);
    const refRaw = $ref.value;
    if (!$y.value || !$m.value || !$d.value){
      reset('생년월일을 입력해주세요.'); return;
    }
    if (!isValidDate(y,m,d)){
      reset('올바른 생년월일이 아닙니다.', true); return;
    }
    if (!refRaw){ reset('기준일을 선택해주세요.', true); return; }
    const [ry,rm,rd] = refRaw.split('-').map(Number);
    if (!isValidDate(ry,rm,rd)){ reset('기준일이 올바르지 않습니다.', true); return; }

    const birthUTC = Date.UTC(y, m-1, d);
    const refUTC = Date.UTC(ry, rm-1, rd);

    if (birthUTC > refUTC){
      reset('생년월일이 기준일보다 미래입니다.', true); return;
    }

    let age = ry - y;
    const hadBirthday = (rm > m) || (rm === m && rd >= d);
    if (!hadBirthday) age -= 1;

    const refDate = new Date(refUTC);
    const nb = nextBirthday(y, m, d, refDate);
    const ddayMs = nb.getTime() - refUTC;
    const ddayDays = Math.round(ddayMs / 86400000);

    const totalDays = Math.round((refUTC - birthUTC)/86400000);
    const kage = ry - y + 1;

    $ageVal.textContent = nf.format(age);
    $dday.textContent = ddayDays === 0 ? '🎉 오늘!' : `D-${nf.format(ddayDays)}`;
    $days.textContent = `${nf.format(totalDays)}일`;
    $kage.textContent = `${nf.format(kage)}세`;
    const nbY = nb.getUTCFullYear(), nbM = nb.getUTCMonth()+1, nbD = nb.getUTCDate();
    let nbNote = '';
    if (m===2 && d===29 && !isLeap(nbY)) nbNote = ' (평년 대체)';
    $nextBday.textContent = `${nbY}-${pad(nbM)}-${pad(nbD)}${nbNote}`;
    $msg.innerHTML = `기준일 <strong style="color:var(--amber-dim)">${ry}-${pad(rm)}-${pad(rd)}</strong> 기준으로 계산했습니다.`;
    $msg.classList.remove('warn');
  }

  function reset(msg, warn){
    $ageVal.textContent = '–';
    $dday.textContent = '–';
    $days.textContent = '–';
    $kage.textContent = '–';
    $nextBday.textContent = '–';
    $msg.textContent = msg;
    $msg.classList.toggle('warn', !!warn);
  }

  [$y,$m,$d,$ref].forEach(el => el.addEventListener('input', compute));
  compute();
</script>
</body>
</html>
