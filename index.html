<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>코딩나우 도구 모음 — 만 나이·연봉·이미지·글자수</title>
<meta name="description" content="설치 없이 브라우저에서 바로 쓰는 무료 도구 모음. 만 나이 계산기, 연봉 실수령액 계산기, 이미지 포맷 변환기, 글자수 세기." />
<meta property="og:title" content="코딩나우 도구 모음" />
<meta property="og:description" content="설치 없이 브라우저에서 바로 쓰는 무료 도구 모음." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b0a08; --panel:#141210; --panel-2:#1c1916;
    --amber:#ffb000; --amber-dim:#b8801f; --amber-glow:rgba(255,176,0,.35);
    --green:#5ddc7a; --red:#e0876a; --line:#2a251e; --muted:#7a6f5c; --text:#f3e7cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono','Gowun Dodum',monospace;line-height:1.55}
  body{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(to bottom, rgba(255,176,0,.04) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .wrap{max-width:960px;width:100%;margin:0 auto;padding:32px 20px 24px;flex:1}
  header.top{margin-bottom:32px}
  .badge{display:inline-block;border:1px solid var(--line);color:var(--amber-dim);padding:4px 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
  h1{
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(28px,4.5vw,40px);
    color:var(--amber);
    text-shadow:0 0 12px var(--amber-glow);
    margin:14px 0 8px;
    letter-spacing:-.01em;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  h1 .cursor{display:inline-block;width:.55ch;background:var(--amber);height:1em;animation:blink 1s steps(1) infinite;box-shadow:0 0 10px var(--amber-glow);vertical-align:-.12em}
  @keyframes blink{50%{opacity:0}}
  .sub{color:var(--muted);font-family:'Gowun Dodum',sans-serif;font-size:15px;margin:0}
  main{flex:1}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}
  @media (max-width:680px){ .grid{grid-template-columns:1fr} }
  a.card{
    display:block;text-decoration:none;color:inherit;
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
    border:1px solid var(--line);border-radius:6px;
    padding:20px;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    position:relative;overflow:hidden;
  }
  a.card::before{
    content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,176,0,.06) 0%,transparent 40%);
    opacity:0;transition:opacity .15s ease;
  }
  a.card:hover,a.card:focus-visible{
    border-color:var(--amber);
    transform:translateY(-2px);
    box-shadow:0 6px 24px -10px var(--amber-glow), 0 0 0 1px var(--amber-glow);
    outline:none;
  }
  a.card:hover::before,a.card:focus-visible::before{opacity:1}
  .card-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .icon{
    font-size:28px;width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;
    background:var(--bg);border:1px solid var(--line);border-radius:4px;
  }
  .name{
    font-family:'JetBrains Mono',monospace;color:var(--amber);font-weight:700;font-size:18px;letter-spacing:-.01em;
    text-shadow:0 0 8px var(--amber-glow);
  }
  .desc{font-family:'Gowun Dodum',sans-serif;color:var(--text);font-size:14.5px;margin:0;opacity:.85}
  .meta{
    margin-top:14px;display:flex;align-items:center;justify-content:space-between;
    color:var(--muted);font-size:12px;letter-spacing:.05em;
  }
  .meta .go{color:var(--amber-dim)}

  .list-bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:8px;padding:11px 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
  }
  .list-bar .count{font-size:13px;color:var(--muted);letter-spacing:.04em}
  .list-bar .count b{color:var(--amber-dim);font-weight:700}
  .list-toggle{
    background:var(--bg);border:1px solid var(--line);color:var(--amber-dim);
    font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.04em;
    padding:7px 12px;border-radius:4px;cursor:pointer;
    transition:border-color .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .list-toggle:hover{border-color:var(--amber);color:var(--amber)}
  .list-toggle:focus-visible{outline:none;border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-glow)}
  .list-toggle .chev{display:inline-block;transition:transform .2s ease;margin-left:4px}
  .list-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}

  .toollist-wrap{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .toollist{display:flex;flex-direction:column;gap:6px;padding-top:8px}
  a.list-row{
    display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
    border:1px solid var(--line);border-radius:5px;padding:10px 14px;
    transition:border-color .12s ease, box-shadow .12s ease, transform .12s ease;
  }
  a.list-row:hover,a.list-row:focus-visible{
    border-color:var(--amber);transform:translateX(2px);
    box-shadow:0 0 0 1px var(--amber-glow), 0 4px 16px -10px var(--amber-glow);outline:none;
  }
  a.list-row .row-icon{font-size:18px;flex:none;width:24px;text-align:center}
  a.list-row .row-name{font-family:'JetBrains Mono',monospace;color:var(--amber);font-weight:700;font-size:14px;flex:none}
  a.list-row .row-desc{
    font-family:'Gowun Dodum',sans-serif;color:var(--muted);font-size:13px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;
  }
  a.list-row .row-go{color:var(--amber-dim);font-size:12px;flex:none}
  @media (max-width:560px){ a.list-row .row-desc{display:none} }

  footer{
    border-top:1px solid var(--line);margin-top:32px;padding:14px 20px;
    color:var(--muted);font-size:12px;letter-spacing:.06em;
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  }
  footer a{color:var(--amber-dim);text-decoration:none}
  footer a[aria-disabled="true"]{pointer-events:none;opacity:.4}
  .prompt::before{content:"$ ";color:var(--amber-dim)}
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <span class="badge">CODINGNOW · 도구 모음</span>
      <h1><span class="prompt"></span>코딩나우 도구<span class="cursor" aria-hidden="true"></span></h1>
      <p class="sub">필요한 도구를 골라 바로 쓰세요. 설치 없이, 무료로. 모든 계산은 브라우저에서만 처리됩니다.</p>
    </header>

    <main>
      <div class="list-bar">
        <span class="count">전체 도구 <b id="toolCount">0</b>개</span>
        <button class="list-toggle" id="listToggle" type="button" aria-expanded="false" aria-controls="toollist">
          목록 열기<span class="chev" aria-hidden="true">▾</span>
        </button>
      </div>
      <div class="toollist-wrap" id="toollistWrap">
        <div class="toollist" id="toollist" role="list"></div>
      </div>

      <div class="grid" id="grid" role="list"></div>
    </main>
  </div>

  <footer>
    <span>CODINGNOW · 도구 모음</span>
    <span><a id="donate" href="#" aria-disabled="true">☕ 후원하기</a></span>
  </footer>

  <script src="tools.js"></script>
  <script>
    const DONATE_URL = "https://paypal.me/codingnow";
    (function(){
      const el = document.getElementById('donate');
      if (DONATE_URL) { el.href = DONATE_URL; el.removeAttribute('aria-disabled'); el.target = "_blank"; el.rel = "noopener"; }
    })();

    (function(){
      const tools = (typeof TOOLS !== 'undefined' && Array.isArray(TOOLS)) ? TOOLS : [];
      const grid = document.getElementById('grid');
      const list = document.getElementById('toollist');

      function el(tag, cls, text){
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      tools.forEach(t => {
        // 카드
        const card = el('a', 'card'); card.href = t.href; card.setAttribute('role', 'listitem');
        const head = el('div', 'card-head');
        const ic = el('span', 'icon', t.icon); ic.setAttribute('aria-hidden', 'true');
        head.appendChild(ic);
        head.appendChild(el('span', 'name', t.name));
        card.appendChild(head);
        card.appendChild(el('p', 'desc', t.desc));
        const meta = el('div', 'meta');
        meta.appendChild(el('span', null, t.slug));
        meta.appendChild(el('span', 'go', '열기 →'));
        card.appendChild(meta);
        grid.appendChild(card);

        // 접이식 목록 행
        const row = el('a', 'list-row'); row.href = t.href; row.setAttribute('role', 'listitem');
        const ri = el('span', 'row-icon', t.icon); ri.setAttribute('aria-hidden', 'true');
        row.appendChild(ri);
        row.appendChild(el('span', 'row-name', t.name));
        row.appendChild(el('span', 'row-desc', t.desc));
        row.appendChild(el('span', 'row-go', '열기 →'));
        list.appendChild(row);
      });

      document.getElementById('toolCount').textContent = tools.length;

      // 접이식 토글
      const wrap = document.getElementById('toollistWrap');
      const btn = document.getElementById('listToggle');
      function setOpen(open){
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        btn.childNodes[0].nodeValue = open ? '목록 닫기' : '목록 열기';
        wrap.style.maxHeight = open ? (list.scrollHeight + 8) + 'px' : '0px';
        try { localStorage.setItem('toollistOpen', open ? '1' : '0'); } catch (e) {}
      }
      btn.addEventListener('click', () => setOpen(btn.getAttribute('aria-expanded') !== 'true'));
      window.addEventListener('resize', () => {
        if (btn.getAttribute('aria-expanded') === 'true') wrap.style.maxHeight = (list.scrollHeight + 8) + 'px';
      });

      let initOpen = false;
      try { initOpen = localStorage.getItem('toollistOpen') === '1'; } catch (e) {}
      setOpen(initOpen);
    })();
  </script>
</body>
</html>
