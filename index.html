<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>만 나이·연봉 실수령액·글자수 계산기 모음 | 코딩나우</title>
<meta name="description" content="설치 없이 브라우저에서 바로 쓰는 무료 도구 모음. 만 나이 계산기, 연봉 실수령액 계산기, 글자수 세기, 사다리 게임." />
<meta property="og:title" content="만 나이·연봉 실수령액·글자수 계산기 모음 | 코딩나우" />
<meta property="og:description" content="설치 없이 브라우저에서 바로 쓰는 무료 도구 모음." />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#0b0a08; --panel:#141210; --panel-2:#1c1916;
    --amber:#ffb000; --amber-dim:#b8801f; --amber-glow:rgba(255,176,0,.35);
    --green:#5ddc7a; --red:#e0876a; --line:#2a251e; --muted:#7a6f5c; --text:#f3e7cf;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono','Gowun Dodum',monospace;line-height:1.55}
  body{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    background:repeating-linear-gradient(to bottom, rgba(255,176,0,.04) 0 1px, transparent 1px 3px);
    mix-blend-mode:multiply;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:49;
    background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%);
  }
  .wrap{max-width:960px;width:100%;margin:0 auto;padding:32px 20px 24px;flex:1}
  header.top{margin-bottom:32px}
  .badge{display:inline-block;border:1px solid var(--line);color:var(--amber-dim);padding:4px 10px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border-radius:2px}
  .top-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex:none}
  .lang button{background:var(--bg);color:var(--muted);border:none;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.05em;padding:6px 11px;cursor:pointer;transition:background .12s ease,color .12s ease}
  .lang button + button{border-left:1px solid var(--line)}
  .lang button.on{background:var(--amber);color:#0b0a08;font-weight:700}
  .lang button:focus-visible{outline:none;box-shadow:inset 0 0 0 2px var(--amber-glow)}
  h1{
    font-family:'JetBrains Mono',monospace;
    font-size:clamp(28px,4.5vw,40px);
    color:var(--amber);
    text-shadow:0 0 12px var(--amber-glow);
    margin:14px 0 8px;
    letter-spacing:-.01em;
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  h1 .cursor{display:inline-block;width:.55ch;background:var(--amber);height:1em;animation:blink 1s steps(1) infinite;box-shadow:0 0 10px var(--amber-glow);vertical-align:-.12em}
  @keyframes blink{50%{opacity:0}}
  .sub{color:var(--muted);font-family:'Gowun Dodum',sans-serif;font-size:15px;margin:0}
  main{flex:1}
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:28px}
  @media (max-width:680px){ .grid{grid-template-columns:1fr} }
  a.card{
    display:block;text-decoration:none;color:inherit;
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
    border:1px solid var(--line);border-radius:6px;
    padding:20px;
    transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    position:relative;overflow:hidden;
  }
  a.card::before{
    content:"";position:absolute;inset:0;border-radius:6px;pointer-events:none;
    background:linear-gradient(180deg,rgba(255,176,0,.06) 0%,transparent 40%);
    opacity:0;transition:opacity .15s ease;
  }
  a.card:hover,a.card:focus-visible{
    border-color:var(--amber);
    transform:translateY(-2px);
    box-shadow:0 6px 24px -10px var(--amber-glow), 0 0 0 1px var(--amber-glow);
    outline:none;
  }
  a.card:hover::before,a.card:focus-visible::before{opacity:1}
  .card-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .icon{
    font-size:28px;width:46px;height:46px;display:inline-flex;align-items:center;justify-content:center;
    background:var(--bg);border:1px solid var(--line);border-radius:4px;
  }
  .name{
    font-family:'JetBrains Mono',monospace;color:var(--amber);font-weight:700;font-size:18px;letter-spacing:-.01em;
    text-shadow:0 0 8px var(--amber-glow);
  }
  .desc{font-family:'Gowun Dodum',sans-serif;color:var(--text);font-size:14.5px;margin:0;opacity:.85}
  .meta{
    margin-top:14px;display:flex;align-items:center;justify-content:space-between;
    color:var(--muted);font-size:12px;letter-spacing:.05em;
  }
  .meta .go{color:var(--amber-dim)}

  .list-bar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    margin-top:8px;padding:11px 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:6px;
  }
  .list-bar .count{font-size:13px;color:var(--muted);letter-spacing:.04em}
  .list-bar .count b{color:var(--amber-dim);font-weight:700}
  .list-toggle{
    background:var(--bg);border:1px solid var(--line);color:var(--amber-dim);
    font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.04em;
    padding:7px 12px;border-radius:4px;cursor:pointer;
    transition:border-color .12s ease, color .12s ease, box-shadow .12s ease;
  }
  .list-toggle:hover{border-color:var(--amber);color:var(--amber)}
  .list-toggle:focus-visible{outline:none;border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-glow)}
  .list-toggle .chev{display:inline-block;transition:transform .2s ease;margin-left:4px}
  .list-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}

  .toollist-wrap{max-height:0;overflow:hidden;transition:max-height .28s ease}
  .toollist{display:flex;flex-direction:column;gap:6px;padding-top:8px}
  a.list-row{
    display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
    border:1px solid var(--line);border-radius:5px;padding:10px 14px;
    transition:border-color .12s ease, box-shadow .12s ease, transform .12s ease;
  }
  a.list-row:hover,a.list-row:focus-visible{
    border-color:var(--amber);transform:translateX(2px);
    box-shadow:0 0 0 1px var(--amber-glow), 0 4px 16px -10px var(--amber-glow);outline:none;
  }
  a.list-row .row-icon{font-size:18px;flex:none;width:24px;text-align:center}
  a.list-row .row-name{font-family:'JetBrains Mono',monospace;color:var(--amber);font-weight:700;font-size:14px;flex:none}
  a.list-row .row-desc{
    font-family:'Gowun Dodum',sans-serif;color:var(--muted);font-size:13px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;
  }
  a.list-row .row-go{color:var(--amber-dim);font-size:12px;flex:none}
  @media (max-width:560px){ a.list-row .row-desc{display:none} }

  .group{margin-top:30px}
  .group:first-child{margin-top:24px}
  .group-title{
    font-family:'JetBrains Mono',monospace;color:var(--amber);
    font-size:14px;letter-spacing:.1em;margin:0;
    display:flex;align-items:center;gap:10px;text-shadow:0 0 8px var(--amber-glow);
  }
  .group-title .gi{
    display:inline-flex;align-items:center;justify-content:center;flex:none;
    width:28px;height:28px;border:1px solid var(--line);border-radius:6px;
    background:var(--bg);color:var(--amber);box-shadow:0 0 10px -4px var(--amber-glow);
  }
  .group-title .gi svg{width:17px;height:17px;display:block}
  .group-title::after{content:"";flex:1;height:1px;background:var(--line)}
  .group-title .gcount{color:var(--muted);font-size:12px;letter-spacing:.04em;text-shadow:none}
  .group .grid{margin-top:14px}

  .support{
    margin-top:34px;padding:16px 20px;border:1px solid var(--line);border-radius:6px;
    background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);
    display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
  }
  .support-msg{font-family:'Gowun Dodum',sans-serif;color:var(--text);font-size:14px;opacity:.9}
  .support-btn{
    text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;
    color:#0b0a08;background:var(--amber);padding:10px 18px;border-radius:5px;white-space:nowrap;
    box-shadow:0 0 16px -4px var(--amber-glow);transition:transform .12s ease, box-shadow .12s ease;
  }
  .support-btn:hover{transform:translateY(-1px);box-shadow:0 0 22px -4px var(--amber-glow)}
  .support-btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--amber-glow)}
  .support-btn[aria-disabled="true"]{pointer-events:none;opacity:.4}

  footer{
    border-top:1px solid var(--line);margin-top:32px;padding:14px 20px;
    color:var(--muted);font-size:12px;letter-spacing:.06em;
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  }
  footer a{color:var(--amber-dim);text-decoration:none}
  footer a[aria-disabled="true"]{pointer-events:none;opacity:.4}
  .prompt::before{content:"$ ";color:var(--amber-dim)}
</style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="top-row">
        <span class="badge" data-i18n="badge">CODINGNOW · 도구 모음</span>
        <div class="lang" role="group" aria-label="Language / 언어">
          <button type="button" data-lang="ko">KR</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </div>
      <h1><span class="prompt"></span><span id="h1text" data-i18n="h1">코딩나우 도구</span><span class="cursor" aria-hidden="true"></span></h1>
      <p class="sub" data-i18n="sub">필요한 도구를 골라 바로 쓰세요. 설치 없이, 무료로. 모든 계산은 브라우저에서만 처리됩니다.</p>
    </header>

    <main>
      <div class="list-bar">
        <span class="count" id="countText"></span>
        <button class="list-toggle" id="listToggle" type="button" aria-expanded="true" aria-controls="toollist">
          <span class="lt-label"></span><span class="chev" aria-hidden="true">▾</span>
        </button>
      </div>
      <div class="toollist-wrap" id="toollistWrap">
        <div class="toollist" id="toollist" role="list"></div>
      </div>

      <div id="groups"></div>

      <div class="support">
        <span class="support-msg" data-i18n="supportMsg">이 도구들이 도움이 되었다면 ☕ 커피 한 잔으로 응원해 주세요.</span>
        <a class="support-btn js-donate" data-i18n="supportBtn" href="#" aria-disabled="true">☕ 후원하기</a>
      </div>
    </main>
  </div>

  <footer>
    <span data-i18n="footer">CODINGNOW · 도구 모음</span>
    <span><a id="donate" class="js-donate" data-i18n="supportBtn" href="#" aria-disabled="true">☕ 후원하기</a></span>
  </footer>

  <!-- tools.js 수정 시 v 값을 올려 캐시 무력화 (브라우저가 옛 도구 목록을 계속 쓰는 문제 방지) -->
  <script src="tools.js?v=2"></script>
  <script>
    const DONATE_URL = "https://paypal.me/codingnow";
    (function(){
      if (!DONATE_URL) return;
      document.querySelectorAll('.js-donate').forEach(el => {
        el.href = DONATE_URL; el.removeAttribute('aria-disabled'); el.target = "_blank"; el.rel = "noopener";
      });
    })();

    (function(){
      const tools = (typeof TOOLS !== 'undefined' && Array.isArray(TOOLS)) ? TOOLS : [];
      const groupsEl = document.getElementById('groups');
      const list = document.getElementById('toollist');
      const wrap = document.getElementById('toollistWrap');
      const btn = document.getElementById('listToggle');

      // UI 문구 사전(ko/en).
      const I18N = {
        ko: {
          badge:"CODINGNOW · 도구 모음",
          h1:"코딩나우 도구",
          sub:"필요한 도구를 골라 바로 쓰세요. 설치 없이, 무료로. 모든 계산은 브라우저에서만 처리됩니다.",
          listOpen:"목록 열기", listClose:"목록 닫기",
          open:"열기 →",
          count:(n)=>`전체 도구 ${n}개`,
          gcount:(n)=>`${n}개`,
          supportMsg:"이 도구들이 도움이 되었다면 ☕ 커피 한 잔으로 응원해 주세요.",
          supportBtn:"☕ 후원하기",
          footer:"CODINGNOW · 도구 모음",
          title:"만 나이·연봉 실수령액·글자수 계산기 모음 | 코딩나우",
        },
        en: {
          badge:"CODINGNOW · TOOLS",
          h1:"CODINGNOW Tools",
          sub:"Pick a tool and use it right away — free, no install. Everything runs in your browser.",
          listOpen:"Show list", listClose:"Hide list",
          open:"Open →",
          count:(n)=>`${n} tools`,
          gcount:(n)=>`${n}`,
          supportMsg:"If these tools helped, support me with a ☕ coffee.",
          supportBtn:"☕ Donate",
          footer:"CODINGNOW · TOOLS",
          title:"Age, Net Salary & Character Counter — Free Online Tools | CODINGNOW",
        },
      };

      function detectLang(){
        try { const s = localStorage.getItem('lang'); if (s === 'ko' || s === 'en') return s; } catch (e) {}
        return (navigator.language || '').toLowerCase().startsWith('ko') ? 'ko' : 'en';
      }
      let lang = detectLang();
      const L = () => I18N[lang];
      const tname = t => (lang === 'en' ? (t.name_en || t.name) : t.name);
      const tdesc = t => (lang === 'en' ? (t.desc_en || t.desc) : t.desc);
      const tglabel = t => (lang === 'en' ? (t.group_en || t.group) : t.group);

      function el(tag, cls, text){
        const n = document.createElement(tag);
        if (cls) n.className = cls;
        if (text != null) n.textContent = text;
        return n;
      }

      // 그룹별 아이콘(인라인 SVG, currentColor 사용). 한국어 그룹명을 키로 쓰고, 새 그룹은 _default.
      const GROUP_ICONS = {
        "계산기 모음": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="2" width="16" height="20" rx="2"/><rect x="8" y="6" width="8" height="3.5" rx="0.5"/><line x1="8" y1="14" x2="8.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/><line x1="16" y1="14" x2="16.01" y2="14"/><line x1="8" y1="18" x2="8.01" y2="18"/><line x1="12" y1="18" x2="12.01" y2="18"/><line x1="16" y1="18" x2="16.01" y2="18"/></svg>',
        "미니 게임": '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5.5"/><line x1="6.5" y1="12.5" x2="9.5" y2="12.5"/><line x1="8" y1="11" x2="8" y2="14"/><line x1="15.5" y1="11.5" x2="15.51" y2="11.5"/><line x1="17.5" y1="13.5" x2="17.51" y2="13.5"/></svg>',
        _default: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>',
      };

      function makeCard(t){
        const card = el('a', 'card'); card.href = t.href; card.setAttribute('role', 'listitem');
        const head = el('div', 'card-head');
        const ic = el('span', 'icon', t.icon); ic.setAttribute('aria-hidden', 'true');
        head.appendChild(ic);
        head.appendChild(el('span', 'name', tname(t)));
        card.appendChild(head);
        card.appendChild(el('p', 'desc', tdesc(t)));
        const meta = el('div', 'meta');
        meta.appendChild(el('span', null, t.slug));
        meta.appendChild(el('span', 'go', L().open));
        card.appendChild(meta);
        return card;
      }

      function makeRow(t){
        const row = el('a', 'list-row'); row.href = t.href; row.setAttribute('role', 'listitem');
        const ri = el('span', 'row-icon', t.icon); ri.setAttribute('aria-hidden', 'true');
        row.appendChild(ri);
        row.appendChild(el('span', 'row-name', tname(t)));
        row.appendChild(el('span', 'row-desc', tdesc(t)));
        row.appendChild(el('span', 'row-go', L().open));
        return row;
      }

      function renderTools(){
        groupsEl.innerHTML = '';
        list.innerHTML = '';
        const order = [];
        const byGroup = new Map();
        tools.forEach(t => {
          const g = t.group || '기타';
          if (!byGroup.has(g)) { byGroup.set(g, []); order.push(g); }
          byGroup.get(g).push(t);
        });
        order.forEach(g => {
          const items = byGroup.get(g);
          const section = el('section', 'group');
          const title = el('h2', 'group-title');
          const gi = el('span', 'gi'); gi.setAttribute('aria-hidden', 'true');
          gi.innerHTML = GROUP_ICONS[g] || GROUP_ICONS._default;
          title.appendChild(gi);
          title.appendChild(el('span', 'gname', tglabel(items[0])));
          title.appendChild(el('span', 'gcount', L().gcount(items.length)));
          section.appendChild(title);
          const grid = el('div', 'grid'); grid.setAttribute('role', 'list');
          items.forEach(t => grid.appendChild(makeCard(t)));
          section.appendChild(grid);
          groupsEl.appendChild(section);
        });
        // 접이식 목록은 그룹 없이 평평하게
        tools.forEach(t => list.appendChild(makeRow(t)));
        document.getElementById('countText').textContent = L().count(tools.length);
      }

      // 접이식 토글
      let isOpen = true;
      try { const v = localStorage.getItem('toollistOpen'); if (v !== null) isOpen = v === '1'; } catch (e) {}
      const ltLabel = btn.querySelector('.lt-label');
      function applyOpen(){
        btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        ltLabel.textContent = isOpen ? L().listClose : L().listOpen;
        wrap.style.maxHeight = isOpen ? (list.scrollHeight + 8) + 'px' : '0px';
      }
      function setOpen(open){
        isOpen = open;
        try { localStorage.setItem('toollistOpen', open ? '1' : '0'); } catch (e) {}
        applyOpen();
      }
      btn.addEventListener('click', () => setOpen(!isOpen));
      window.addEventListener('resize', () => { if (isOpen) wrap.style.maxHeight = (list.scrollHeight + 8) + 'px'; });

      function applyLang(){
        document.documentElement.lang = lang;
        document.title = L().title;
        document.querySelectorAll('[data-i18n]').forEach(node => {
          const v = L()[node.getAttribute('data-i18n')];
          if (typeof v === 'string') node.textContent = v;
        });
        document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.getAttribute('data-lang') === lang));
        renderTools();
        applyOpen();
      }

      document.querySelectorAll('.lang button').forEach(b => {
        b.addEventListener('click', () => {
          const next = b.getAttribute('data-lang');
          if (next === lang) return;
          lang = next;
          try { localStorage.setItem('lang', lang); } catch (e) {}
          applyLang();
        });
      });

      applyLang();
    })();
  </script>
</body>
</html>
