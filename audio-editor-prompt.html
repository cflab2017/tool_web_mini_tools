  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'JetBrains Mono','Gowun Dodum',monospace;line-height:1.55}
  body{min-height:100vh;display:flex;flex-direction:column;position:relative;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom, rgba(255,176,0,.04) 0 1px, transparent 1px 3px);mix-blend-mode:multiply}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%)}

  h1{font-family:'JetBrains Mono',monospace;font-size:clamp(24px,4vw,34px);color:var(--amber);text-shadow:0 0 12px var(--amber-glow);margin:12px 0 6px;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

  .btn:focus-visible{outline:none;border-color:var(--amber);box-shadow:0 0 0 2px var(--amber-glow)}

  footer{border-top:1px solid var(--line);margin-top:24px;padding:14px 20px;color:var(--muted);font-size:12px;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .prompt::before{content:"$ ";color:var(--amber-dim)}

  <script type="text/plain" id="promptSrc">
# Claude Code 작업 지시서 — 오디오(음악) 편집기 (웹, 브라우저 완결)

## 0. 역할과 목표
너는 프론트엔드 개발자다. 단일 HTML(CSS·JS 인라인)로 동작하는 웹 오디오 편집기를 만든다.
빌드 도구·서버·프레임워크 없음. 모든 디코딩·편집·인코딩은 브라우저에서 완결(서버/업로드 없음 → 정적 호스팅 가능).
핵심 셀링포인트: "파일을 업로드하지 않고 브라우저에서만 처리" (프라이버시).

## 1. 폴더 / 파일 구조
index.html          ← 오디오 편집기 (진입점, 단일 파일)
- 이 도구는 독립 저장소의 단일 페이지로 동작한다.
- (선택) 기존 "코딩나우 도구 모음"에 합칠 경우 tools/audio-editor.html 로 넣고 메인 tools.js에 항목 1개 추가하면 됨.

## 2. 공통 디자인 시스템 (기존 도구 모음과 동일)
다크 "앰버 CRT 터미널" 테마. CSS 변수:
--bg:#0b0a08; --panel:#141210; --panel-2:#1c1916;
--amber:#ffb000; --amber-dim:#b8801f; --amber-glow:rgba(255,176,0,.35);
--green:#5ddc7a; --red:#e0876a; --line:#2a251e; --muted:#7a6f5c; --text:#f3e7cf;
- 폰트: Google Fonts — JetBrains Mono(UI/숫자) + Gowun Dodum(한글).
  https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Gowun+Dodum&display=swap
- 공통: 상단 badge + h1(앰버, 글로우, 깜빡이는 커서) + 한 줄 설명.
- CRT 스캔라인 오버레이(repeating-linear-gradient, mix-blend-mode:multiply) + 비네팅.
- 입력/버튼 focus 시 앰버 테두리 + 은은한 글로우. 주요 버튼은 앰버 배경.
- 푸터: 좌측 "CODINGNOW · 오디오 편집기", 우측 "☕ 후원하기"(const DONATE_URL 상수, 비면 비활성).
- 상단에 "← 도구 목록" 링크 자리를 둔다(독립 저장소면 생략 가능, 합칠 때 ../index.html로 연결).
- SEO 메타태그(title, description, og:title, og:description), 반응형(모바일 세로 스택).

## 3. 기능 사양 — 오디오 편집기

[입력]
- 파일 선택: 드래그앤드롭 + 클릭 선택. 허용: audio/* (mp3, wav, m4a/aac, ogg 등 브라우저 디코딩 가능 포맷).
- 디코딩: AudioContext.decodeAudioData() → AudioBuffer. 디코딩 실패 시 안내.

[파형 & 재생]
- canvas에 파형(피크) 렌더링. 채널 다운믹스해서 표시(또는 첫 채널).
- 재생/일시정지/정지(AudioBufferSourceNode), 현재 재생 위치 커서 표시.
- 파형 위에서 드래그로 구간 선택(시작~끝), 선택 구간 하이라이트. 시작/끝 시간 숫자 입력으로도 미세조정.

[편집 기능 — 전부 AudioBuffer 샘플 가공]
- 선택 구간만 남기기(crop) / 선택 구간 삭제(cut).
- 페이드 인 / 페이드 아웃(구간 또는 전체, 선형 게인 램프).
- 볼륨(게인) 조절(0~200%, 클리핑 방지 안내).
- (선택) 앞뒤 무음 트림, 노멀라이즈(피크 기준).
- 각 편집은 현재 버퍼에 적용하고 파형/정보 갱신. 실행취소(undo) 1~다단계 권장(편집 전 버퍼 스택 보관).

[내보내기 — MVP = 라이브러리 없음]
- WAV 내보내기(필수): 16-bit PCM WAV 인코더를 직접 작성(RIFF 헤더 + 인터리브 PCM). Blob → 다운로드.
- 결과 파일명: 원본이름_edited.wav.
- (선택 확장) MP3 내보내기: 브라우저에 MP3 인코더가 없으므로 CDN 라이브러리 lamejs 1개 사용
  (예: @breezystack/lamejs). 옵션 비트레이트(128/192/320). 라이브러리 미사용을 원하면 비활성.

[출력 정보 표시]
- 원본/편집본: 길이(mm:ss.ms), 샘플레이트, 채널 수, 예상 용량. 전후 비교.

## 4. 구현 주의 (중요)
- 전부 클라이언트 처리, 업로드/전송 없음을 한 줄 명시(프라이버시 = 셀링포인트).
- WAV 인코더는 직접 구현(외부 의존 0). 16-bit PCM, little-endian, 멀티채널 인터리브.
- decodeAudioData는 비동기 + 일부 브라우저에서 콜백형 → Promise 래핑.
- AudioBufferSourceNode는 일회용(재생마다 새로 생성). AudioContext는 사용자 제스처 후 resume().
- 대용량/장시간 파일은 메모리 부담 → 권장 길이/용량 상한 안내(예: 10~15분), 초과 시 경고.
- 큰 파형은 피크 다운샘플링으로 렌더(픽셀당 min/max), requestAnimationFrame로 재생 커서 갱신.
- 시간 표기 mm:ss.ms, 용량 천단위 콤마, UTF-8 안전.
- 외부 라이브러리는 가급적 미사용. 불가피한 MP3 인코딩만 CDN 1개 이내.

## 5. SEO
- title 예: 무료 오디오 자르기·편집기 (mp3·wav) — 업로드 없이 브라우저에서
- description: 업로드 없이 브라우저에서 mp3·wav를 자르고 페이드·볼륨 편집 후 WAV로 저장.
- og:title / og:description 동일 맥락.

## 6. 완료 검증 기준
- mp3/wav 파일 드롭 → 파형 표시 + 재생/일시정지/정지 동작.
- 드래그로 구간 선택 → "구간만 남기기" / "구간 삭제"가 정확히 적용(길이 변화 확인).
- 페이드 인/아웃, 볼륨 조절이 청취/파형으로 확인됨.
- WAV 내보내기 다운로드 → 재생/재import 시 정상.
- (확장 시) MP3 내보내기 다운로드 정상.
- 전후 정보(길이·샘플레이트·채널·용량) 표시, 실행취소 동작.
- 디자인이 기존 도구 모음과 동일 룩앤필, 모바일 반응형 정상, 업로드 없음 안내 노출.

먼저 전체 계획을 요약하고, WAV 내보내기까지 되는 MVP를 먼저 완성한 뒤(무의존),
MP3 내보내기는 별도 옵션으로 추가하라. 파형 렌더·구간 선택·자르기·WAV 인코딩의 정확성을 최우선으로 하라.
</script>

  <script>
    const promptText = document.getElementById('promptSrc').textContent.replace(/^\n/, '').replace(/\s+$/, '');
    const out = document.getElementById('out');
    out.textContent = promptText;

    const chars = Array.from(promptText).length;
    const lines = promptText.split('\n').length;
    document.getElementById('meta').textContent = `${chars.toLocaleString('ko-KR')}자 · ${lines.toLocaleString('ko-KR')}줄`;
    document.getElementById('charinfo').textContent = `${chars.toLocaleString('ko-KR')}자`;

    const toast = document.getElementById('toast');
    let toastTimer = null;
    function showToast(msg){
      toast.textContent = msg;
      toast.classList.add('on');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('on'), 1600);
    }

    document.getElementById('copy').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(promptText);
        showToast('복사되었습니다 ✓');
      } catch (e) {
        const r = document.createRange();
        r.selectNodeContents(out);
        const sel = window.getSelection();
        sel.removeAllRanges(); sel.addRange(r);
        try { document.execCommand('copy'); showToast('복사되었습니다 ✓'); }
        catch (_) { showToast('복사 실패 — 직접 선택해 복사하세요'); }
        sel.removeAllRanges();
      }
    });
  </script>
</body>
</html>
